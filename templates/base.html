<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}OsintNeoAI{% endblock %}</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#0a0a0a;--fg:#00ff41;--card:#111;--border:#00ff4133;--dim:#00ff4180;--err:#ff4444;--warn:#ffaa00}
        body{background:var(--bg);color:var(--fg);font-family:'Courier New',monospace;font-size:14px;padding:0;min-height:100vh;padding-bottom:70px}
        a{color:var(--fg);text-decoration:none}
        .topbar{background:#111;border-bottom:1px solid var(--border);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .topbar h1{font-size:1.1em;text-shadow:0 0 10px var(--fg)}
        .topbar .status{font-size:0.7em;color:var(--dim)}
        .nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:flex;z-index:100}
        .nav a{flex:1;text-align:center;padding:12px 5px;font-size:0.7em;color:var(--dim);transition:color 0.2s}
        .nav a.active{color:var(--fg);text-shadow:0 0 8px var(--fg)}
        .container{padding:10px}
        .card{background:var(--card);border:1px solid var(--border);padding:12px;margin:8px 0;border-radius:6px}
        .card h3{color:var(--fg);font-size:0.85em;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:5px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        @media(max-width:400px){.grid{grid-template-columns:1fr}}
        button{background:var(--fg);color:#000;border:none;padding:8px 12px;margin:3px;cursor:pointer;font-family:inherit;font-weight:bold;font-size:0.8em;border-radius:4px;width:100%}
        button:active{opacity:0.8;transform:scale(0.98)}
        button.secondary{background:#333;color:var(--fg);border:1px solid var(--border)}
        button.danger{background:var(--err);color:#fff}
        pre{background:#000;padding:8px;margin-top:6px;overflow-x:auto;max-height:300px;overflow-y:auto;border:1px solid #333;font-size:0.75em;white-space:pre-wrap;word-break:break-all;border-radius:4px}
        .label{color:var(--dim);font-size:0.75em;margin-bottom:4px}
        .value{color:var(--fg);font-size:1em}
        .badge{display:inline-block;background:var(--fg);color:#000;padding:2px 6px;border-radius:3px;font-size:0.7em;font-weight:bold}
        .badge.warn{background:var(--warn)}
        .badge.err{background:var(--err)}
        .mt-1{margin-top:8px}
        .mt-2{margin-top:16px}
        .mb-1{margin-bottom:8px}
        .text-center{text-align:center}
        .text-dim{color:var(--dim)}
        .text-sm{font-size:0.8em}
        .hidden{display:none}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .pulse{animation:pulse 2s infinite}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--fg);border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="topbar">
        <h1>OSINTNEOAI</h1>
        <span class="status pulse">LIVE | $0.00</span>
    </div>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <nav class="nav">
        <a href="/" class="{% if active == 'home' %}active{% endif %}">HOME</a>
        <a href="/chat" class="{% if active == 'chat' %}active{% endif %}">CHAT</a>
        <a href="/pipeline" class="{% if active == 'pipeline' %}active{% endif %}">PIPE</a>
        <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">SYS</a>
    </nav>
</body>
</html>
